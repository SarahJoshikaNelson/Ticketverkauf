# Test Configuration - H2 In-Memory Database
quarkus.datasource.db-kind=h2
quarkus.datasource.username=test
quarkus.datasource.password=test
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Disable mailer for testing
quarkus.mailer.mock=true

# Disable OIDC for testing
quarkus.oidc.enabled=false

# JWT Configuration for tests
mp.jwt.verify.publickey.location=/publicKey.pem
mp.jwt.verify.issuer=https://maturaball.htl-leonding.ac.at/issuer
smallrye.jwt.sign.key.location=/privateKey.pem

# Disable SSL for tests
quarkus.http.ssl-port=
quarkus.http.ssl.certificate.key-store-file=

# Test logging
quarkus.log.level=INFO
quarkus.log.category."at.htlleonding".level=DEBUG

