<body style="font-family: Arial, sans-serif; font-size: 14px; color: #333;">
    <p><strong>E-Mail-Adresse bestätigen</strong></p>

    <p>Bitte verwenden Sie den folgenden Bestätigungscode, um Ihre E-Mail-Adresse zu verifizieren:</p>

    <p style="text-align: left; margin: 30px 0;">
        <span style="background-color: #f4f4f4; border: 1px solid #ddd; padding: 14px 28px; display: inline-block; border-radius: 4px; font-size: 28px; font-weight: bold; letter-spacing: 6px; color: #0321a7;">
            {code}
        </span>
    </p>

    <p>Der Code ist <strong>10 Minuten</strong> gültig.</p>

    <p style="color: #999; font-size: 12px;">Falls Sie diesen Code nicht angefordert haben, können Sie diese E-Mail ignorieren.</p>
