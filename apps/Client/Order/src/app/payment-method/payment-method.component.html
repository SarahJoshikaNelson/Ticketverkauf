<div class="coming-soon-message text-center mt-8">
  <h2 class="text-2xl font-bold text-primary">Zahlungsmethoden</h2>
  <p class="mt-2 text-gray-600">Weitere Zahlungsmethoden kommen bald!</p>
  <button class="btn bg-transparent hover:bg-gray-100 text-primary" (click)="goBack()">Zurück</button>
  <button class="btn btn-primary mt-4" (click)="continueToSummary()">Weiter zur Übersicht</button>
</div>
