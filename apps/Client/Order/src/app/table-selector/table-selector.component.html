<div class="w-full flex flex-col gap-4">
  <!-- Canvas Display -->
  @if (connectionError) {
  <div
    class="w-full flex items-center justify-center p-8 bg-red-50 border border-red-300 rounded-lg"
  >
    <div class="text-center">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-16 w-16 text-red-500 mx-auto mb-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        />
      </svg>
      <h3 class="text-xl font-bold text-red-700 mb-2">Nicht verfügbar</h3>
      <p class="text-red-600">
        Die Tischauswahl ist momentan nicht verfügbar, da keine Verbindung
        hergestellt werden konnte.
      </p>
      <p class="text-red-500 text-sm mt-2">
        Bitte versuchen Sie es später erneut oder kontaktieren Sie den Support.
      </p>
    </div>
  </div>
  } @else {
  <canvas class="relative border" #tablesCanvas id="tablesCanvas"></canvas>
  }
</div>
