<div
  (click)="action.emit()"
  [style]="{ height: size().height, width: size().width }"
  [class]="'relative border-primary border-2 pb-0.5 pt-0.5 rounded-meins tracking-wide flex justify-center items-center text-primary font-medium group overflow-hidden cursor-pointer select-none' + (name() ? ' pr-5 pl-5' : ' pr-0.5 pl-0.5')"
>
  <p class="transition-colors duration-300 group-hover:text-white">
    @if (isLoading()) {
      <img
        src="/logo.ico"
        [class]="'rounded-full ring-1 ring-accent animate-spin' + (name() ? ' w-8' : ' w-6')"
      />
    } @else if (name()) {
      {{ name() }}
    } @else {
      <svg
        class="w-4 h-4"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
        ></path>
      </svg>
    }
  </p>
  <div
    class="flex justify-center items-center absolute w-full h-full top-0 left-0 -z-10"
  >
    <span
      class="relative transition-all duration-500 w-0 rounded-full ease-in-out bg-primary aspect-square group-hover:w-full group-hover:scale-110"
    >
    </span>
  </div>
</div>
