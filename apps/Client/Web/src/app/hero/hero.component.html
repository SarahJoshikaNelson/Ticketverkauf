<div class="absolute blur-3xl top-0 left-0 h-full w-full -z-30">
  <span class="absolute top-1/3 left-1/4 bg-accent w-80 h-64 opacity-30 rounded-full"></span>
  <span class="absolute top-[30%] left-[60%] bg-accent w-96 h-72 opacity-30 rounded-full"></span>
  <span class="absolute top-2/3 left-[42.5%] bg-accent w-96 h-52 opacity-30 rounded-full"></span>
</div>

<div id="headline" class="flex justify-center items-center flex-col w-full gap-10">
  <div class="flex items-start max-sm:items-center flex-col justify-center w-full max-sm:w-2/3 gap-2.5 group">
    <p id="topic" class="text-primary text-2xl max-sm:text-lg">{{ subtitle }}</p>
    <h1 id="desc" class="tracking-wide text-5xl font-semibold max-sm:text-4xl max-sm:text-center">{{ title }}</h1>
    <span id="separator-line"
      class="transition-all duration-300 ease-in-out w-5/6 h-1 bg-primary rounded max-sm:w-full group-hover:w-full"></span>
  </div>
  <app-button name="Ballkarten Kaufen" [color]="color" (action)="navigateToOrderPage()"></app-button>
  @if (isLoading()) {
    <app-button name="Laden..." [color]="color"></app-button>
  }
  @else {
    <app-button name="Bestellungen Ansehen" [color]="color" (action)="navigateToOrderListPage()"></app-button>
  }
</div>
