<div id="student-login" class="flex flex-col justify-center gap-2 items-center bg-white h-full">
    <p class="p-5 text-xl">Sind Sie ein Schüler?</p>
    <div class="flex flex-row justify-center items-center gap-5 max-sm:flex-col">
        <button (click)="data.login()"
            class="p-2 shadow-md bg-purple-600 rounded text-white transition-all duration-300 hover:scale-105 hover:shadow-lg">Als Schüler Fortfahren</button>
        <button (click)="close()"
            class="p-2 shadow-md bg-red-500 rounded text-white transition-all duration-300 hover:scale-105 hover:shadow-lg">Nein</button>
    </div>
</div>
