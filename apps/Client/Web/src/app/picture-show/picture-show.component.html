<div
  class="w-full shadow-md shadow-black bg-background bg-opacity-100 h-fit py-5 flex justify-center items-center flex-col gap-2.5 group max-sm:rounded">
  <div id="header" class="flex flex-col">
    <h1 class="text-text font-semibold text-3xl">
      Maturaball {{ maturaballYear() }}
    </h1>
    <span class="w-3/4 max-sm:w-full group-hover:w-full h-0.5 bg-primary transition-all duration-300 rounded"></span>
  </div>

  <div class="h-auto py-16 relative flex flex-row flex-wrap gap-5 items-center justify-evenly w-full">
    @for (image of images(); track $index) {
      <app-picture-frame [src]="image" />
    }
  </div>
</div>
