<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <style>
    .line {
      stroke: red;
      stroke-width: 6;
      stroke-linecap: round;
      animation: move-lines 3s ease-in-out infinite;
    }

    /* Animation for the lines swapping places */
    @keyframes move-lines {
      0%, 100% {
        /* Initial position */
        x1: 10;
        y1: 10;
        x2: 90;
        y2: 90;
      }
      50% {
        /* Swapped positions (moving diagonally) */
        x1: 90;
        y1: 10;
        x2: 10;
        y2: 90;
      }
    }

    .line2 {
      animation-delay: 1.5s; /* Delay second line to create alternating effect */
    }
  </style>

  <!-- First line of the "X" -->
  <line class="line" x1="10" y1="10" x2="90" y2="90" />
  <!-- Second line of the "X" -->
  <line class="line line2" x1="10" y1="90" x2="90" y2="10" />
</svg>
