quarkus.swagger-ui.path=/swag
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:4201,http://localhost:5173,http://localhost:5176,http://localhost:3000
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true



# OIDC provider configuration (replace with your Keycloak server details)
quarkus.oidc.auth-server-url=https://auth.htl-leonding.ac.at/realms/htlleonding
quarkus.oidc.client-id=htlleonding-service
quarkus.http.ssl-port=8443
quarkus.http.ssl.certificate.key-store-file=keystore.jks
quarkus.http.ssl.certificate.key-store-password=mypasswd
# Configure maximum request size (50MB)
quarkus.http.limits.max-body-size=50M
quarkus.http.body.handle-file-uploads=true
quarkus.http.body.uploads-directory=uploads
quarkus.http.body.delete-uploaded-files-on-end=false

quarkus.http.io-threads=8
quarkus.http.read-timeout=30M
quarkus.http.write-timeout=30M
quarkus.http.idle-timeout=30M
quarkus.http.tcp-cork=true
quarkus.http.tcp-quick-ack=true
quarkus.http.tcp-fast-open=true
quarkus.http.so-keep-alive=true

mp.jwt.verify.publickey.location=classpath:/publicKey.pem
mp.jwt.verify.issuer=https://maturaball.htl-leonding.ac.at/issuer

quarkus.native.resources.includes=publicKey.pem,rsaPrivateKey.pem

smallrye.jwt.sign.key.location=classpath:/rsaPrivateKey.pem
# Enable HTTP/2
quarkus.http.http2=true

# Worker thread pool configuration
quarkus.thread-pool.max-threads=50
quarkus.thread-pool.queue-size=100
quarkus.vertx.worker-pool-size=20

# Enable response compression
quarkus.resteasy.gzip.enabled=true
quarkus.resteasy.gzip.max-input=10M

org.gradle.jvmargs=-Xmx2g
org.gradle.daemon=false
org.gradle.parallel=true
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000

# Additional server tuning
quarkus.vertx.eventbus.connect-timeout=30000
quarkus.vertx.eventbus.idle-timeout=30000
quarkus.http.so-reuse-port=true
quarkus.http.tcp-nodelay=true

quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true

config.order-url=${ORDER_URL:http://localhost:4201}
config.shop-url=${SHOP_URL:http://localhost:5176}
config.web-url=${WEB_URL:https://maturaball.htl-leonding.ac.at}

