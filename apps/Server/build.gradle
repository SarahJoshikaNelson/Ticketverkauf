plugins {
    id 'java'
}

allprojects {
    group 'at.htlleonding'
    version '1.0.0-SNAPSHOT'
}

wrapper {
    gradleVersion = '9.8.2'
}

subprojects {
    apply plugin: 'java'

    repositories {
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.0.1'
        implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
        implementation group: 'com.stripe', name: 'stripe-java', version: '26.5.1'

        compileOnly 'org.projectlombok:lombok:1.18.48'
        annotationProcessor 'org.projectlombok:lombok:1.18.48'

        testCompileOnly 'org.projectlombok:lombok:1.18.48'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
        testImplementation 'org.mockito:mockito-core:5.8.0'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.8.0'

        testImplementation("io.quarkus:quarkus-junit5")
        testImplementation("io.quarkus:quarkus-junit5-mockito")
        testImplementation("io.rest-assured:rest-assured")
        testImplementation("org.assertj:assertj-core:3.24.2")
        testImplementation("org.hamcrest:hamcrest:2.2")
        
        // Embedded PostgreSQL for testing (no Docker required)
        testImplementation("io.zonky.test:embedded-postgres:2.0.7")
        testImplementation("io.quarkus:quarkus-jdbc-postgresql")
    }

    compileJava {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    compileTestJava {
        options.encoding = 'UTF-8'
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_27
        targetCompatibility = JavaVersion.VERSION_27
    }

    test {
        systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
    }
}